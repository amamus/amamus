  </g>
  <g class="antennae">
    <path class="stalk" d="M 922 356 C 912 322 898 292 882 264" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round"/>
    <path class="stalk" d="M 992 356 C 1004 322 1020 292 1036 264" fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round"/>
    <circle class="tip" cx="866" cy="217" r="48" fill="currentColor"/>
    <circle class="tip" cx="1056" cy="217" r="48" fill="currentColor"/>
    <circle class="highlight" cx="884" cy="198" r="14" fill="#FFFFFF"/>
    <circle class="highlight" cx="1074" cy="198" r="14" fill="#FFFFFF"/>
