<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="snail-mono-title">
  <title id="snail-mono-title">amamus iocum snail logo (monochrome)</title>
  <!-- Monochrome variant: every shape uses currentColor. Face strokes are white,
       so use this variant on light backgrounds only. -->
  <g class="baseline">
    <path d="M 428 770 C 421 791 430 808 460 816 C 530 826 680 824 800 818 C 880 814 940 806 968 794" fill="none" stroke="currentColor" stroke-width="42" stroke-linecap="round"/>
  </g>
  <g class="shell">
    <path fill="currentColor" fill-rule="evenodd" d="M 700 406
      C 765 406 820 450 832 520
      C 840 578 850 652 848 722
      C 812 756 745 770 716 767
      C 658 774 604 780 550 750
      C 503 724 476 660 462 588
      C 466 543 488 503 516 478
      C 550 440 622 406 700 406
      Z
      M 663 507
      A 91 91 0 1 0 663 689
      A 91 91 0 1 0 663 507
      Z"/>
  </g>
  <g class="body">
    <path fill="currentColor" d="M 957 336
      C 1000 336 1030 360 1044 400
      C 1052 420 1053 424 1052 440
      C 1048 520 1030 600 1005 675
      C 985 735 958 785 925 812
      C 900 830 862 832 842 820
      C 840 700 840 590 846 512
      C 846 460 858 428 884 394
      C 900 372 922 334 957 336
      Z"/>
    <g class="face" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round">
      <g class="eyes">
        <path d="M 897 417 Q 923 390 949 417"/>
        <path d="M 969 417 Q 997 390 1025 417"/>
      </g>
      <path class="smile" d="M 931 448 Q 960 476 990 448"/>
